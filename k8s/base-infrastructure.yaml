# -----------------------------------------------------------
# CATALOG SERVICE (main1.py)
# -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: catalog
        image: ttl.sh/lumina-backend-vgu:v5 # Change this!
        imagePullPolicy: Always
        # This tells Python to treat the /app directory as a source folder
        env:
        - name: PYTHONPATH
          value: "/app" 
        command: ["uvicorn", "catalog_service.main1:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000

---
# -----------------------------------------------------------
# REACT FRONTEND (Nginx)
# -----------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ttl.sh/lumina-frontend-vgu:2h
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80